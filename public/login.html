<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Event Ticketing</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <main style="max-width: 440px; margin: 50px auto; padding: 1.5rem;">
        <h1 id="form-title">Log In</h1>
        <p id="form-message" role="status">Use an account to book tickets or manage events.</p>
        <div id="error-banner" class="alert-error" role="alert" hidden></div>
        
        <form id="auth-form">
            <div class="form-field">
                <label for="email" style="display: block; margin-bottom: 5px;">Email</label>
                <input type="email" id="email" autocomplete="email" required>
            </div>
            <div class="form-field">
                <label for="password" style="display: block; margin-bottom: 5px;">Password (min 8 characters)</label>
                <input type="password" id="password" autocomplete="current-password" required minlength="8">
            </div>
            <div id="role-container" class="form-field" hidden>
                <label for="role" style="display: block; margin-bottom: 5px;">Role</label>
                <select id="role">
                    <option value="attendee">Attendee</option>
                    <option value="organizer">Organizer</option>
                    <option value="staff">Staff</option>
                </select>
            </div>
            <button type="submit" id="submit-btn" class="btn">Log In</button>
        </form>

        <p style="margin-top: 15px; text-align: center;">
            <a href="#" id="toggle-mode">Need an account? Sign up</a>
        </p>
    </main>

    <script type="module" src="/Js/login.js"></script>
</body>
</html>
