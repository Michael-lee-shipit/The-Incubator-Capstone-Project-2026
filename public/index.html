<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Event Ticketing - Browse Events</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header>
    <h1>🎟️ Event Hub</h1>
    <nav class="nav-links">
      <a href="/login.html">Log in / Sign up</a>
      <a href="/tickets.html">My tickets</a>
      <a href="/organizer.html">Organizer</a>
      <a href="/docs.html">API docs</a>
    </nav>
  </header>
  <main>
    <h2>Upcoming Events</h2>
    <div class="filters-bar">
      <label>Search
        <input type="text" id="search-input" placeholder="Event title or venue...">
      </label>
      <label>City
        <select id="city-select">
          <option value="">All Cities</option>
          <option value="Lagos">Lagos</option>
          <option value="Abuja">Abuja</option>
          <option value="Port Harcourt">Port Harcourt</option>
        </select>
      </label>
      <label>Max Price (₦)
        <input type="number" id="max-price-input" placeholder="e.g. 5000000">
      </label>
      <label>Sort By
        <select id="sort-select">
          <option value="">Default</option>
          <option value="date">Date</option>
          <option value="price">Price (Low to High)</option>
          <option value="availability">Availability</option>
        </select>
      </label>
    </div>
    <p id="events-status" role="status">Loading events…</p>
    <div id="events-error" class="alert-error" role="alert" hidden></div>
    <div id="events-container" class="events-grid"></div>
  </main>
  <script type="module">
    import { initHome } from './Js/pages/home.js';
    initHome();
  </script>
</body>
</html>
