<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Tickets</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <header style="padding: 20px; background: #f8f9fa; display: flex; justify-content: space-between; align-items: center;">
        <h1>My Bookings</h1>
        <nav>
            <a href="/">Browse Events</a> | 
            <button id="logout-btn" style="padding: 5px 10px; cursor: pointer;">Log Out</button>
        </nav>
    </header>

    <main class="container" style="padding: 20px; max-width: 800px; margin: auto;">
        <div id="loading" style="display: none; color: #666;">Loading your tickets...</div>
        <div id="error" style="color: #ff6b6b; background: #ffe3e3; padding: 10px; margin-bottom: 15px; display: none; border-radius: 4px;"></div>
        
        <ul id="bookings-list" style="list-style: none; padding: 0;"></ul>
    </main>

    <script type="module" src="/js/tickets.js"></script>
</body>
</html>
